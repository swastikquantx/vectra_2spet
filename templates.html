<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vectra Templates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#ffffff', accent: '#7c3aed' },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Syne', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans min-h-screen flex flex-col selection:bg-accent selection:text-white">

  <header class="h-16 border-b border-zinc-900 flex items-center justify-between px-6 lg:px-12 bg-zinc-950/80 backdrop-blur sticky top-0 z-50">
      <a class="flex items-center gap-3" href="index.html">
        <img src="https://raw.githubusercontent.com/swastikquantx/vectra_2spet/main/vectra_logo.jpg" alt="Vectra" class="w-9 h-9 rounded-md object-contain bg-white">
        <div class="flex flex-col justify-center">
          <span class="font-display font-bold tracking-tight text-xl text-white leading-none">Vectra</span>
          <span class="text-[10px] text-zinc-400 font-medium mt-1 leading-none">Create Cinematic Magic</span>
        </div>
      </a>
    <nav class="hidden md:flex items-center gap-8 font-medium text-sm text-zinc-400">
      <a href="create-studio.html" class="hover:text-white transition-colors">Create Studio</a>
      <a href="templates.html" class="text-white">Templates</a>
      <a href="pricing.html" class="hover:text-white transition-colors">Pricing</a>
    </nav>
    <div class="flex items-center gap-4">
      <a href="login.html" class="text-sm font-medium hover:text-white transition-colors text-zinc-400">Login</a>
      <a href="create-studio.html" class="hidden md:flex items-center justify-center bg-white text-black px-4 py-2 rounded-full text-sm font-semibold hover:bg-zinc-200 transition-colors">Start Creating</a>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-6 lg:px-12 py-16">
    <div class="mb-12">
      <h1 class="font-display font-extrabold text-4xl tracking-tight text-white mb-4">Templates</h1>
      <p class="text-zinc-400 text-lg">Reusable starting points for every Vectra output type.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="templateGrid">
      <!-- Injected by script -->
    </div>
  </main>

  <div data-global-footer></div>

  <script src="assets/js/core.js"></script>
  <script src="components/footer.js"></script>
  <script>
    const templates = [
      { name: 'Social Reel', desc: 'Vertical video synthesis pipeline with auto-captions.' },
      { name: 'Product Video', desc: 'Cinematic commercial render with AI voiceover.' },
      { name: 'Ad Creative', desc: 'Multi-variant image ad campaign generator.' },
      { name: 'Landing Page', desc: 'Full-stack application blueprint and UI layout.' },
      { name: 'Podcast Cover', desc: 'Branded visual asset workflow.' },
      { name: 'YouTube Thumbnail', desc: 'High-contrast click-through optimized images.' },
      { name: 'Voiceover Pack', desc: 'Multi-lingual TTS script execution.' },
      { name: 'Brand Launch', desc: 'Complete brand kit and asset generation.' },
      { name: 'App Prototype', desc: 'Interactive SaaS dashboard scaffold.' }
    ];

    document.getElementById('templateGrid').innerHTML = templates.map((x, i) => `
      <article class="bg-zinc-900/50 border border-zinc-800/80 rounded-2xl p-6 hover:bg-zinc-900 hover:border-zinc-700 transition-all group flex flex-col h-full">
        <div class="w-10 h-10 rounded-lg bg-zinc-800 flex items-center justify-center mb-6 text-zinc-500 font-mono text-xs group-hover:text-violet-400 group-hover:bg-violet-900/20 transition-colors">0${i+1}</div>
        <h3 class="font-display font-bold text-lg text-white mb-2">${x.name}</h3>
        <p class="text-sm text-zinc-400 mb-8 flex-1 leading-relaxed">${x.desc}</p>
        <a class="inline-flex items-center justify-center w-full bg-zinc-800 hover:bg-zinc-700 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors border border-zinc-700/50" href="create-studio.html?template=${encodeURIComponent(x.name)}">
          Use Template
        </a>
      </article>
    `).join('');
  </script>
</body>
</html>
