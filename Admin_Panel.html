<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VECTRA AI - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .syne { font-family: 'Syne', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #09090b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#09090b] text-zinc-300 h-screen overflow-hidden flex">

  <!-- Sidebar -->
  <aside class="w-64 border-r border-zinc-800 bg-[#0c0c0e] flex flex-col hidden md:flex shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-zinc-800">
      <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-600 to-violet-600 flex items-center justify-center mr-3">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </div>
      <span class="syne text-white font-bold text-lg tracking-tight">VECTRA <span class="text-zinc-500">ADMIN</span></span>
    </div>
    
    <div class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
      <p class="px-2 text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2 mt-4">System Overview</p>
      <a href="#" class="flex items-center gap-3 px-3 py-2 bg-blue-600/10 text-blue-500 rounded-lg text-[13px] font-semibold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        Dashboard
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2 text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200 rounded-lg text-[13px] font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        Users & Quotas
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2 text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200 rounded-lg text-[13px] font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        Compute Nodes
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2 text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200 rounded-lg text-[13px] font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
        GPU Cluster Load
      </a>
      
      <p class="px-2 text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2 mt-6">Content</p>
      <a href="#" class="flex items-center gap-3 px-3 py-2 text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200 rounded-lg text-[13px] font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        Active Generations
      </a>
      <a href="#" class="flex items-center gap-3 px-3 py-2 text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200 rounded-lg text-[13px] font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        Moderation Queue
      </a>
    </div>

    <div class="p-4 border-t border-zinc-800">
      <button onclick="if(window.parent && window.parent.active){ window.parent.active='User_Dashboard.html'; window.parent.render(); window.parent.route(); }" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg text-[13px] font-bold transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Exit to App
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <!-- Topbar -->
    <header class="h-16 shrink-0 flex items-center justify-between px-8 border-b border-zinc-800 bg-[#0c0c0e]/80 backdrop-blur-md relative z-20">
      <h1 class="text-[16px] font-bold text-white syne tracking-wide">Command Center</h1>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
           <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
           <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">All Systems Normal</span>
        </div>
        <div class="h-8 w-px bg-zinc-800 mx-2"></div>
        <button class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </button>
      </div>
    </header>

    <!-- Scrollable content (React CRM) -->
    <div class="flex-1 overflow-y-auto bg-white text-slate-900 custom-scrollbar" id="crm-root" style="color: black !important; font-family: 'Inter', sans-serif;">
    </div>
    
    <script type="text/babel">
      const { useState, useEffect } = React;

      const StatCard = ({ title, value, sub, trend }) => (
        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col">
          <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">{title}</span>
          <div className="flex items-baseline gap-3">
            <span className="text-3xl font-black font-mono text-slate-900">{value}</span>
            <span className={`text-[11px] font-bold ${trend > 0 ? 'text-emerald-500' : 'text-rose-500'}`}>
              {trend > 0 ? '+' : ''}{trend}%
            </span>
          </div>
          <span className="text-xs text-slate-400 mt-2 font-medium">{sub}</span>
        </div>
      );

      const Dashboard = () => {
        return (
          <div className="p-8 max-w-7xl mx-auto space-y-8 bg-zinc-50 min-h-full">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-2xl font-bold text-slate-900 syne">System Dashboard</h2>
                <p className="text-sm text-slate-500 mt-1">Real-time metrics for Vectra Video Engine.</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              <StatCard title="Active Render Jobs" value="1,284" sub="Across 34 nodes" trend={12.5} />
              <StatCard title="GPU Utilization" value="87%" sub="Peak load" trend={4.2} />
              <StatCard title="Total Users" value="45.2k" sub="Registered accounts" trend={2.1} />
              <StatCard title="Avg Render Time" value="14.2s" sub="Per 1080p frame" trend={-1.4} />
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Active Jobs Table */}
              <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div className="px-5 py-4 border-b border-slate-200 flex justify-between items-center">
                  <h3 className="font-bold text-sm text-slate-800">Recent Render Jobs</h3>
                  <button className="text-[11px] font-bold text-indigo-600 hover:text-indigo-700">View All</button>
                </div>
                <div className="flex-1 overflow-x-auto">
                  <table className="w-full text-left text-sm whitespace-nowrap">
                    <thead className="bg-slate-50 text-slate-500 font-medium text-[11px] uppercase tracking-wider">
                      <tr>
                        <th className="px-5 py-3">Job ID</th>
                        <th className="px-5 py-3">User</th>
                        <th className="px-5 py-3">Status</th>
                        <th className="px-5 py-3">Progress</th>
                        <th className="px-5 py-3">Engine</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-slate-600">
                      {[
                        { id: "RND-9923", user: "john.doe@example.com", status: "Rendering", prog: 65, engine: "Cinematic v4" },
                        { id: "RND-9924", user: "studio_alpha", status: "Queued", prog: 0, engine: "Anime v2" },
                        { id: "RND-9925", user: "marketing_team", status: "Completed", prog: 100, engine: "Cinematic v4" },
                        { id: "RND-9926", user: "creator_xyz", status: "Rendering", prog: 88, engine: "Photoreal v1" },
                        { id: "RND-9927", user: "beta_tester", status: "Failed", prog: 12, engine: "Cinematic v4" }
                      ].map(job => (
                        <tr key={job.id} className="hover:bg-slate-50">
                          <td className="px-5 py-3 font-mono text-xs font-semibold text-slate-900">{job.id}</td>
                          <td className="px-5 py-3">{job.user}</td>
                          <td className="px-5 py-3">
                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                              job.status === 'Rendering' ? 'bg-blue-100 text-blue-700' :
                              job.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' :
                              job.status === 'Failed' ? 'bg-rose-100 text-rose-700' :
                              'bg-slate-100 text-slate-700'
                            }`}>{job.status}</span>
                          </td>
                          <td className="px-5 py-3">
                            <div className="flex items-center gap-2">
                              <div className="w-24 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                <div className={`h-full rounded-full ${job.status === 'Failed' ? 'bg-rose-500' : 'bg-indigo-500'}`} style={{ width: `${job.prog}%` }}></div>
                              </div>
                              <span className="text-[10px] font-mono">{job.prog}%</span>
                            </div>
                          </td>
                          <td className="px-5 py-3 text-xs">{job.engine}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Node Status */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div className="px-5 py-4 border-b border-slate-200">
                  <h3 className="font-bold text-sm text-slate-800">GPU Node Health</h3>
                </div>
                <div className="p-5 space-y-4">
                  {[
                    { node: "us-east-1a", type: "NVIDIA H100", load: 92, status: "High" },
                    { node: "us-east-1b", type: "NVIDIA H100", load: 88, status: "High" },
                    { node: "eu-west-1", type: "NVIDIA A100", load: 64, status: "Normal" },
                    { node: "ap-south-1", type: "NVIDIA A100", load: 42, status: "Normal" },
                    { node: "us-west-2", type: "NVIDIA H100", load: 98, status: "Critical" },
                  ].map(n => (
                    <div key={n.node} className="flex items-center justify-between">
                      <div>
                        <div className="font-mono text-xs font-bold text-slate-900">{n.node}</div>
                        <div className="text-[10px] text-slate-500">{n.type}</div>
                      </div>
                      <div className="text-right">
                        <div className={`font-mono text-sm font-bold ${
                          n.load > 90 ? 'text-rose-600' : n.load > 80 ? 'text-amber-500' : 'text-emerald-600'
                        }`}>{n.load}%</div>
                        <div className="text-[10px] text-slate-400">{n.status}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const rootElement = document.getElementById("crm-root");
      if (rootElement) {
         const root = ReactDOM.createRoot(rootElement);
         root.render(<Dashboard />);
      }
    </script>
    </main>

</body>
</html>
