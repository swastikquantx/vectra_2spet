<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VECTRA - AI Director's Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: Inter, sans-serif; background: #0a0a0a; color: white; }
        .syne { font-family: Syne, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glow { box-shadow: 0 0 20px rgba(79, 70, 229, 0.3); }
    </style>
    <!-- FFmpeg scripts (Single-threaded core for cross-origin compatibility) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center p-8">
    <header class="w-full max-w-5xl flex justify-between items-center mb-12">
        <div class="flex items-center gap-3">
            <div class="flex flex-col font-black leading-[0.82] tracking-[0.18em] text-[14px] syne">
                <span>VECTRA</span><span class="text-indigo-400">STUDIO</span>
            </div>
        </div>
        <a href="/" class="text-sm font-medium text-zinc-400 hover:text-white transition px-4 py-2 rounded-full border border-zinc-800 hover:bg-zinc-800">Exit Studio</a>
    </header>

    <main class="w-full max-w-5xl flex flex-col gap-8">
        <!-- Input Area -->
        <div class="glass rounded-3xl p-8 flex flex-col gap-6 glow">
            <div>
                <h1 class="text-3xl font-bold syne mb-2 text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-500">Director's Orchestrator</h1>
                <p class="text-zinc-400 text-sm">Write your concept. The <strong class="text-indigo-400">Master Orchestrator</strong> will coordinate Gemini, FLUX, Bark, and MusicGen, then use FFmpeg to compose the final cut right here.</p>
            </div>
            <div class="flex gap-4 items-stretch">
                <input type="text" id="prompt" class="flex-1 bg-black/50 border border-zinc-700/50 rounded-2xl px-6 py-4 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-lg" placeholder="e.g., A cinematic trailer about a mission to Mars, epic tone...">
                <button id="generateBtn" class="bg-white hover:bg-zinc-200 text-black font-bold px-8 rounded-2xl transition flex items-center gap-2 syne uppercase tracking-wider text-sm">
                    Action! 🎬
                </button>
            </div>
        </div>

        <!-- Status & Timeline -->
        <div id="statusArea" class="hidden glass rounded-3xl p-8 flex-col gap-6">
            <div class="flex justify-between items-end">
                <h2 class="text-xl font-bold syne">Timeline Pipeline</h2>
                <span id="statusBadge" class="px-3 py-1 bg-indigo-500/20 text-indigo-400 text-xs font-bold uppercase rounded-full border border-indigo-500/30">Initializing</span>
            </div>
            
            <div id="logs" class="text-xs font-mono text-zinc-400 h-48 overflow-y-auto bg-[#050505] p-5 rounded-2xl border border-zinc-800/50 leading-relaxed"></div>
            
            <!-- Storyboard Preview -->
            <div id="storyboard" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4"></div>
        </div>

        <!-- Video Player -->
        <div id="playerArea" class="hidden flex-col items-center gap-6 mt-4">
            <h2 class="text-3xl font-bold syne text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Final Masterpiece</h2>
            <video id="outputVideo" controls autoplay class="w-full max-w-4xl rounded-2xl shadow-[0_0_50px_rgba(79,70,229,0.2)] border border-indigo-500/20 bg-black"></video>
            <a id="downloadBtn" class="mt-2 text-sm text-indigo-400 hover:text-indigo-300 underline underline-offset-4 cursor-pointer">Download 4K MP4</a>
        </div>
    </main>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const { fetchFile } = FFmpegUtil;

        const promptEl = document.getElementById('prompt');
        const generateBtn = document.getElementById('generateBtn');
        const statusArea = document.getElementById('statusArea');
        const logsEl = document.getElementById('logs');
        const storyboardEl = document.getElementById('storyboard');
        const playerArea = document.getElementById('playerArea');
        const outputVideo = document.getElementById('outputVideo');
        const statusBadge = document.getElementById('statusBadge');
        const downloadBtn = document.getElementById('downloadBtn');

        let ffmpeg = null;

        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString([], {hour12:false});
            const colorClass = isError ? 'text-red-400' : 'text-zinc-300';
            logsEl.innerHTML += `<div class="${colorClass} mb-1"><span class="text-zinc-600">[${time}]</span> ${msg}</div>`;
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        async function initFFmpeg() {
            if (ffmpeg) return;
            log('Initializing WebAssembly Video Engine (FFmpeg)...');
            ffmpeg = new FFmpeg();
            ffmpeg.on('log', ({ message }) => {
                if(message.includes('frame=') || message.includes('Error')) {
                    log(`<span class="text-zinc-500">FFmpeg:</span> ${message}`);
                }
            });
            // Use single-threaded core
            await ffmpeg.load({
                coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
                wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'
            });
            log('FFmpeg Engine Ready.');
        }

        generateBtn.addEventListener('click', async () => {
            const userPrompt = promptEl.value.trim();
            if (!userPrompt) {
                alert('Please enter a creative concept.');
                return;
            }

            // Reset UI
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            generateBtn.innerHTML = 'Orchestrating...';
            statusArea.classList.remove('hidden');
            statusArea.classList.add('flex');
            playerArea.classList.add('hidden');
            storyboardEl.innerHTML = '';
            logsEl.innerHTML = '';
            statusBadge.innerText = 'Calling Models';

            try {
                // Initialize Video Engine first
                await initFFmpeg();

                log('Contacting Master Orchestrator... (Please wait ~30-60s for models to generate)');
                log('<span class="text-indigo-400">Gemini</span> is writing the script...');
                log('<span class="text-indigo-400">FLUX</span> is generating visual frames...');
                log('<span class="text-indigo-400">Bark</span> is synthesizing Voiceovers...');
                log('<span class="text-indigo-400">MusicGen</span> is composing background tracks...');

                const orchRes = await fetch('/api/orchestrate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userPrompt })
                });
                
                if (!orchRes.ok) {
                    const err = await orchRes.json();
                    throw new Error(err.error || 'Orchestration failed');
                }
                
                const data = await orchRes.json();
                log(`Orchestration complete! Fetched ${data.scenes.length} scenes + Soundtrack.`);
                statusBadge.innerText = 'Assembling Timeline';

                // Step 1: Write Soundtrack
                await ffmpeg.writeFile('music.wav', await fetchFile(data.soundtrack));

                const outputFiles = [];

                // Step 2: Render each scene with Voice sync
                for (let i = 0; i < data.scenes.length; i++) {
                    const scene = data.scenes[i];
                    log(`<b>Scene ${scene.scene}:</b> "${scene.narration}"`);
                    
                    // Display preview
                    const container = document.createElement('div');
                    container.innerHTML = `
                        <img src="${scene.visual}" class="w-full aspect-[16/9] object-cover rounded-xl border border-zinc-700/50 shadow-lg mb-2">
                        <div class="text-xs text-zinc-400 italic">"${scene.narration}"</div>
                    `;
                    storyboardEl.appendChild(container);

                    const imgName = `image_${i}.jpg`;
                    const voiceName = `voice_${i}.wav`;
                    const outName = `scene_${i}.mp4`;
                    
                    await ffmpeg.writeFile(imgName, await fetchFile(scene.visual));
                    await ffmpeg.writeFile(voiceName, await fetchFile(scene.voice));
                    
                    log(`Compositing Scene ${scene.scene} (Image + Voice Sync)...`);
                    
                    // Generate video exactly as long as the audio (-shortest) with cinematic zoompan
                    await ffmpeg.exec([
                        '-loop', '1', 
                        '-i', imgName, 
                        '-i', voiceName,
                        '-vf', "zoompan=z='min(zoom+0.001,1.5)':d=9000:s=1280x720", 
                        '-c:v', 'libx264', 
                        '-c:a', 'aac', 
                        '-b:a', '192k',
                        '-shortest', 
                        '-pix_fmt', 'yuv420p', 
                        outName
                    ]);
                    outputFiles.push(outName);
                }

                // Step 3: Stitching
                log('Stitching all scenes into a master cut...');
                const concatList = outputFiles.map(f => `file '${f}'`).join('\n');
                await ffmpeg.writeFile('concat.txt', concatList);
                
                await ffmpeg.exec([
                    '-f', 'concat', 
                    '-safe', '0', 
                    '-i', 'concat.txt',
                    '-c', 'copy',
                    'stitched.mp4'
                ]);

                // Step 4: Final Audio Mix (Voice + Ducked Background Music)
                log('Applying Professional Audio Mix (Voiceover + Ducked Music)...');
                statusBadge.innerText = 'Mixing Audio';

                await ffmpeg.exec([
                    '-i', 'stitched.mp4',
                    '-i', 'music.wav',
                    '-filter_complex', '[1:a]volume=0.15[bg];[0:a][bg]amix=inputs=2:duration=first[aout]',
                    '-map', '0:v',
                    '-map', '[aout]',
                    '-c:v', 'copy',
                    '-c:a', 'aac',
                    'masterpiece.mp4'
                ]);

                // Step 5: Export
                log('Exporting Final Masterpiece...');
                const finalData = await ffmpeg.readFile('masterpiece.mp4');
                const videoBlob = new Blob([finalData.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                
                outputVideo.src = videoUrl;
                downloadBtn.href = videoUrl;
                downloadBtn.download = 'VECTRA_Masterpiece.mp4';
                
                playerArea.classList.remove('hidden');
                playerArea.classList.add('flex');
                
                statusBadge.innerText = 'Complete';
                statusBadge.classList.replace('bg-indigo-500/20', 'bg-emerald-500/20');
                statusBadge.classList.replace('text-indigo-400', 'text-emerald-400');
                statusBadge.classList.replace('border-indigo-500/30', 'border-emerald-500/30');
                log('<b class="text-emerald-400">Full Pipeline Rendered Successfully! 🎬</b>');

            } catch (err) {
                console.error(err);
                log(`Fatal Error: ${err.message}`, true);
                statusBadge.innerText = 'Error';
                statusBadge.classList.replace('bg-indigo-500/20', 'bg-red-500/20');
                statusBadge.classList.replace('text-indigo-400', 'text-red-400');
                statusBadge.classList.replace('border-indigo-500/30', 'border-red-500/30');
            } finally {
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                generateBtn.innerHTML = 'Action! 🎬';
            }
        });
    </script>
</body>
</html>
