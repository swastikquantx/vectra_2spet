<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VECTRA - Creation Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .syne { font-family: 'Syne', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
    
    input[type=range] {
      -webkit-appearance: none;
      background: #27272a;
      height: 4px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #8b5cf6;
      cursor: pointer;
      box-shadow: 0 0 0 2px #09090b;
    }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-300 h-screen overflow-hidden flex flex-col font-sans">
  
  <!-- Topbar -->
  <header class="h-14 bg-[#18181b] border-b border-zinc-800 flex items-center justify-between px-4 shrink-0">
     <div class="flex items-center gap-4">
        <button onclick="if(window.parent && window.parent.active){ window.parent.active='User_Dashboard.html'; window.parent.render(); window.parent.route(); } else { window.history.back(); }" class="text-zinc-400 hover:text-white transition p-1 rounded hover:bg-zinc-800">
           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
        <div class="h-4 w-px bg-zinc-700"></div>
        <div class="flex items-center gap-2">
            <span class="text-[13px] font-semibold text-zinc-100">Cyberpunk City Pan</span>
            <button class="text-zinc-500 hover:text-zinc-300"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
        </div>
        <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">Auto-saved</span>
     </div>
     <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 mr-4">
           <svg class="w-4 h-4 text-amber-400" viewBox="0 0 20 20" fill="currentColor"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/></svg>
           <span class="text-xs font-semibold text-zinc-300">8,500</span>
        </div>
        <button class="text-[13px] font-medium text-zinc-400 hover:text-white px-3 py-1.5 rounded-md hover:bg-zinc-800 transition">Share</button>
        <button class="text-[13px] font-semibold bg-white text-black px-4 py-1.5 rounded-md hover:bg-zinc-200 transition">Export MP4</button>
     </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 flex overflow-hidden">
     
     <!-- Left Panel: Controls -->
     <aside class="w-[340px] bg-[#09090b] border-r border-zinc-800 flex flex-col h-full relative z-10 shrink-0">
        <div class="flex-1 overflow-y-auto p-5 space-y-6 custom-scrollbar">
           
           <!-- Prompt Area -->
           <div class="space-y-2">
              <label class="text-[11px] font-bold text-zinc-100 uppercase tracking-widest flex items-center justify-between">
                 Prompt
                 <button onclick="openEnhanceModal()" class="text-violet-400 hover:text-violet-300 font-medium normal-case tracking-normal flex items-center gap-1 transition-colors hover:bg-violet-500/10 px-2 py-1 rounded">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    Enhance
                 </button>
              </label>
              <textarea id="prompt-input" class="w-full bg-[#18181b] border border-zinc-800 rounded-xl p-3 text-[13px] text-zinc-100 focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none resize-none h-32 placeholder:text-zinc-600 transition-all leading-relaxed" placeholder="Describe the scene in detail... e.g. A neon-lit cyberpunk street scene, rain reflecting the pink and blue lights, cinematic tracking shot, 4k resolution.">A breathtaking aerial pan over a dense, neon-lit cyberpunk metropolis at midnight. Rain is pouring heavily, reflecting bright magenta and cyan holograms in the wet asphalt below. Hyper-realistic, 8k resolution, cinematic lighting.</textarea>
           </div>
           
           <!-- Negative Prompt (Collapsed) -->
           <div class="space-y-2">
               <button class="flex items-center gap-2 text-[11px] font-semibold text-zinc-500 hover:text-zinc-300 uppercase tracking-widest transition-colors w-full text-left">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                  Negative Prompt
               </button>
           </div>

           <!-- Model Selection -->
           <div class="space-y-3">
              <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-widest">Model</label>
              <select class="w-full bg-[#18181b] border border-zinc-800 rounded-xl p-3 text-[13px] text-zinc-100 outline-none hover:border-zinc-700 transition-colors cursor-pointer appearance-none">
                 <option>VECTRA-3 Cinematic</option>
                 <option>VECTRA-Fast (Draft)</option>
                 <option>VECTRA-HyperReal</option>
              </select>
           </div>

           <!-- Aspect Ratio -->
           <div class="space-y-3">
              <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-widest">Aspect Ratio</label>
              <div class="grid grid-cols-4 gap-2">
                 <button class="bg-[#18181b] border border-violet-500 text-white rounded-xl py-3 text-[11px] font-semibold flex flex-col items-center gap-2 hover:bg-zinc-900 transition-colors shadow-[0_0_10px_rgba(139,92,246,0.1)]">
                    <div class="w-6 h-3.5 border-2 border-current rounded-sm"></div>16:9
                 </button>
                 <button class="bg-[#18181b] border border-zinc-800 text-zinc-500 rounded-xl py-3 text-[11px] font-semibold flex flex-col items-center gap-2 hover:border-zinc-600 hover:text-zinc-300 transition-colors">
                    <div class="w-3.5 h-6 border-2 border-current rounded-sm"></div>9:16
                 </button>
                 <button class="bg-[#18181b] border border-zinc-800 text-zinc-500 rounded-xl py-3 text-[11px] font-semibold flex flex-col items-center gap-2 hover:border-zinc-600 hover:text-zinc-300 transition-colors">
                    <div class="w-4 h-4 border-2 border-current rounded-sm"></div>1:1
                 </button>
                 <button class="bg-[#18181b] border border-zinc-800 text-zinc-500 rounded-xl py-3 text-[11px] font-semibold flex flex-col items-center gap-2 hover:border-zinc-600 hover:text-zinc-300 transition-colors">
                    <div class="w-6 h-2.5 border-2 border-current rounded-sm"></div>21:9
                 </button>
              </div>
           </div>

           <!-- Camera Motion -->
           <div class="space-y-4 pt-2 border-t border-zinc-800/50">
              <div class="flex items-center justify-between">
                 <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-widest">Camera Motion</label>
                 <span class="text-[10px] text-violet-400 bg-violet-500/10 px-2 py-0.5 rounded font-medium">Advanced</span>
              </div>
              <div class="space-y-4">
                 <div class="flex items-center gap-4 group">
                    <span class="text-[12px] font-medium text-zinc-400 w-12 group-hover:text-zinc-200 transition-colors">Pan X</span>
                    <input type="range" class="flex-1 accent-violet-500" min="-10" max="10" value="4">
                    <span class="text-[11px] text-zinc-500 w-6 text-right font-mono">4.0</span>
                 </div>
                 <div class="flex items-center gap-4 group">
                    <span class="text-[12px] font-medium text-zinc-400 w-12 group-hover:text-zinc-200 transition-colors">Pan Y</span>
                    <input type="range" class="flex-1 accent-violet-500" min="-10" max="10" value="-2">
                    <span class="text-[11px] text-zinc-500 w-6 text-right font-mono">-2.0</span>
                 </div>
                 <div class="flex items-center gap-4 group">
                    <span class="text-[12px] font-medium text-zinc-400 w-12 group-hover:text-zinc-200 transition-colors">Zoom</span>
                    <input type="range" class="flex-1 accent-violet-500" min="-10" max="10" value="1">
                    <span class="text-[11px] text-zinc-500 w-6 text-right font-mono">1.0</span>
                 </div>
              </div>
           </div>

           <!-- Length & Motion -->
           <div class="flex gap-4 pt-2">
               <div class="flex-1 space-y-3">
                  <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-widest">Duration</label>
                  <select class="w-full bg-[#18181b] border border-zinc-800 rounded-xl p-2.5 text-[13px] text-zinc-100 outline-none hover:border-zinc-700 transition-colors cursor-pointer appearance-none">
                     <option>4 Seconds</option>
                     <option>8 Seconds (Pro)</option>
                     <option>16 Seconds (Max)</option>
                  </select>
               </div>
               <div class="flex-1 space-y-3">
                  <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-widest">Motion</label>
                  <select class="w-full bg-[#18181b] border border-zinc-800 rounded-xl p-2.5 text-[13px] text-zinc-100 outline-none hover:border-zinc-700 transition-colors cursor-pointer appearance-none">
                     <option>Subtle</option>
                     <option selected>Dynamic</option>
                     <option>Extreme</option>
                  </select>
               </div>
           </div>
        </div>

        <!-- Generate Button -->
        <div class="p-4 border-t border-zinc-800 bg-[#09090b]">
           <button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.2)] flex justify-between items-center transition-all group">
              <span class="text-[14px]">Generate Video</span>
              <span class="text-xs font-semibold bg-black/20 px-2 py-1 rounded-md flex items-center gap-1.5 group-hover:bg-black/30 transition-colors">
                 <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 20 20" fill="currentColor"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/></svg>
                 15
              </span>
           </button>
        </div>
     </aside>

     <!-- Center: Preview & Timeline -->
     <section class="flex-1 flex flex-col bg-[#121214] relative">
        <!-- Grid Background -->
        <div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 1px 1px, #a1a1aa 1px, transparent 0); background-size: 32px 32px;"></div>
        
        <!-- Video Player -->
        <div class="flex-1 flex items-center justify-center p-6 lg:p-10 z-10 relative">
           <div class="w-full max-w-5xl aspect-video bg-black rounded-2xl border border-zinc-800/80 shadow-[0_20px_60px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden relative group">
              <img id="main-preview" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop" class="w-full h-full object-cover transition-opacity duration-300" />
              
              <!-- Play Overlay -->
              <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 cursor-pointer">
                 <button class="w-20 h-20 bg-white/10 backdrop-blur-md border border-white/20 rounded-full flex items-center justify-center text-white hover:scale-105 hover:bg-white/20 transition-all duration-300 shadow-2xl">
                    <svg class="w-10 h-10 ml-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                 </button>
              </div>
              
              <!-- Player Controls -->
              <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-black via-black/80 to-transparent flex items-center px-6 gap-5 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                 <button class="text-white hover:text-violet-400 transition-colors"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                 <div class="flex-1 h-1.5 bg-zinc-700/80 rounded-full cursor-pointer relative group/scrubber">
                    <div class="absolute left-0 top-0 bottom-0 w-[45%] bg-blue-500 rounded-full"></div>
                    <div class="absolute left-[45%] top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-lg opacity-0 group-hover/scrubber:opacity-100 transition-opacity scale-75 group-hover/scrubber:scale-100"></div>
                 </div>
                 <span class="text-[13px] font-medium text-zinc-300 font-mono tracking-wider">00:06 / 00:15</span>
                 <button class="text-zinc-400 hover:text-white transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg></button>
              </div>
           </div>
        </div>

        <!-- Generations Strip (Timeline) -->
        <div class="h-56 border-t border-zinc-800/80 bg-[#18181b]/95 backdrop-blur-xl z-10 p-5 flex flex-col gap-4">
           <div class="flex justify-between items-center px-1">
              <h3 class="text-[11px] font-bold text-zinc-400 uppercase tracking-widest">Project Generations</h3>
              <button class="text-[12px] text-blue-400 hover:text-blue-300 font-semibold transition-colors">View Asset Library &rarr;</button>
           </div>
           
           <div class="flex gap-4 overflow-x-auto pb-3 custom-scrollbar px-1">
              <!-- Item 1: Active -->
              <div id="gen-v3" onclick="loadVersion('v3')" class="w-48 shrink-0 aspect-video bg-zinc-900 rounded-xl border-2 border-blue-500 overflow-hidden relative cursor-pointer shadow-lg shadow-blue-500/10 transition-transform hover:-translate-y-1 gen-thumb">
                 <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop" class="w-full h-full object-cover" />
                 <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">V3</div>
              </div>
              
              <!-- Item 2 -->
              <div id="gen-v2" onclick="loadVersion('v2')" class="w-48 shrink-0 aspect-video bg-zinc-900 rounded-xl border border-zinc-700 overflow-hidden relative cursor-pointer hover:border-zinc-500 transition-all hover:-translate-y-1 group gen-thumb">
                 <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2564&auto=format&fit=crop" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity" />
                 <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">V2</div>
              </div>
              
              <!-- Item 3: Rendering -->
              <div class="w-48 shrink-0 aspect-video bg-[#121214] rounded-xl border border-emerald-500/30 overflow-hidden relative flex flex-col items-center justify-center gap-3 transition-transform hover:-translate-y-1">
                 <div class="absolute inset-0 bg-emerald-500/5 animate-pulse"></div>
                 <svg class="w-6 h-6 text-emerald-500 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                 <span class="text-[11px] font-bold text-emerald-500 tracking-wider">RENDERING 45%</span>
                 
                 <!-- Progress Bar -->
                 <div class="absolute bottom-0 left-0 right-0 h-1 bg-emerald-950">
                    <div class="h-full bg-emerald-500" style="width: 45%;"></div>
                 </div>
              </div>
              
           </div>
        </div>
     </section>
  </main>

    <!-- Enhance Prompt Modal -->
    <div id="enhance-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center transition-opacity">
       <div class="bg-[#18181b] border border-zinc-800 rounded-3xl p-10 max-w-md w-full flex flex-col items-center shadow-2xl relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-b from-violet-500/10 to-transparent"></div>
          <div class="relative w-16 h-16 mb-6">
             <div class="absolute inset-0 border-4 border-zinc-800 rounded-full"></div>
             <div class="absolute inset-0 border-4 border-violet-500 rounded-full border-t-transparent animate-spin"></div>
             <svg class="w-6 h-6 text-violet-400 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          </div>
          <h2 class="text-[18px] font-bold text-white mb-2 relative z-10">Enhancing Prompt...</h2>
          <p class="text-[13px] text-zinc-400 text-center relative z-10 leading-relaxed">Applying cinematic modifiers, camera logic, and lighting semantics via VECTRA LLM.</p>
       </div>
    </div>
    
    <script>
      // 1. Interactive History Logic
      const versions = {
        'v3': {
          img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop',
          prompt: 'A breathtaking aerial pan over a dense, neon-lit cyberpunk metropolis at midnight. Rain is pouring heavily, reflecting bright magenta and cyan holograms in the wet asphalt below. Hyper-realistic, 8k resolution, cinematic lighting.'
        },
        'v2': {
          img: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2564&auto=format&fit=crop',
          prompt: 'A retro synthwave digital landscape loop. Glowing grid lines, neon pink sun on the horizon, driving through a digital mountain range. Low-poly aesthetic, vibrant colors, 80s outrun style.'
        }
      };
      
      function loadVersion(id) {
        const previewImg = document.getElementById('main-preview');
        // Fade out
        previewImg.style.opacity = '0';
        
        setTimeout(() => {
           // Change src
           previewImg.src = versions[id].img;
           // Fade back in
           previewImg.style.opacity = '1';
        }, 150);
        
        // Update prompt
        document.getElementById('prompt-input').value = versions[id].prompt;
        
        // Update styling on thumbs
        document.querySelectorAll('.gen-thumb').forEach(el => {
           el.classList.remove('border-blue-500', 'border-2');
           el.classList.add('border-zinc-700', 'border');
           
           // Handle internal image opacity
           const img = el.querySelector('img');
           if (img) {
               img.classList.remove('opacity-100');
               img.classList.add('opacity-60');
           }
        });
        
        // Highlight active
        const active = document.getElementById('gen-' + id);
        active.classList.remove('border-zinc-700', 'border');
        active.classList.add('border-blue-500', 'border-2');
        const activeImg = active.querySelector('img');
        if (activeImg) {
            activeImg.classList.remove('opacity-60');
            activeImg.classList.add('opacity-100');
        }
      }
      
      // 2. Enhance Prompt Modal Logic
      function openEnhanceModal() {
        const modal = document.getElementById('enhance-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        setTimeout(() => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          
          const currentPrompt = document.getElementById('prompt-input').value;
          document.getElementById('prompt-input').value = currentPrompt + " Shot on Arri Alexa 65, 50mm lens, f/1.8, deep depth of field, anamorphic lens flares, unreal engine 5 render, volumetric fog, god rays, masterpiece, highly detailed.";
          
          // Flash textarea to indicate change
          const ta = document.getElementById('prompt-input');
          ta.classList.add('ring-1', 'ring-violet-500', 'bg-violet-500/10');
          setTimeout(() => {
             ta.classList.remove('ring-1', 'ring-violet-500', 'bg-violet-500/10');
          }, 600);
        }, 1500);
      }
    </script>
    </body>
</html>
